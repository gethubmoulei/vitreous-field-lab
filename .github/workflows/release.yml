name: Release static site

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0.0."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Package static site
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="FloatersSimulation-static-${RELEASE_TAG}.zip"
          (cd out && zip -r "../${archive}" .)
          sha256sum "${archive}" > "${archive}.sha256"
          echo "ARCHIVE_NAME=${archive}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
